# Build and publish dist/ to GitHub Pages on every push to main.
#
# Two jobs on purpose: the suite runs before anything is uploaded, so a red
# test blocks the deploy rather than shipping alongside it. The build job
# uploads dist/ as the Pages artifact; the deploy job publishes it. Pages
# must be set to "GitHub Actions" as its source once, in the repository's
# Settings → Pages, for the deploy job to have anywhere to put it.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push cancels an older in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
